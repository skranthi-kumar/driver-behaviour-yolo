<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Behaviour Detection</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e8e8e8;
    min-height: 100vh;
  }

  header {
    background: #1a1d27;
    border-bottom: 1px solid #2a2d3a;
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 36px; height: 36px;
    background: #dc2626;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  header h1 { font-size: 17px; font-weight: 600; color: #f0f0f0; }
  header p  { font-size: 12px; color: #888; margin-top: 1px; }

  .badge {
    margin-left: auto;
    background: #1e3a1e;
    color: #4ade80;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid #166534;
  }

  main {
    max-width: 1100px;
    margin: 2rem auto;
    padding: 0 1.5rem;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 1.5rem;
  }

  .card {
    background: #1a1d27;
    border: 1px solid #2a2d3a;
    border-radius: 12px;
    overflow: hidden;
  }

  .card-header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid #2a2d3a;
    font-size: 13px;
    font-weight: 500;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Upload area */
  .upload-area {
    margin: 1.5rem;
    border: 2px dashed #2a2d3a;
    border-radius: 10px;
    padding: 2.5rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-area:hover, .upload-area.drag-over {
    border-color: #dc2626;
    background: rgba(220,38,38,0.05);
  }
  .upload-area svg { margin-bottom: 12px; opacity: 0.4; }
  .upload-area p { font-size: 14px; color: #888; }
  .upload-area span { color: #dc2626; font-weight: 500; }
  #fileInput { display: none; }

  /* Preview */
  .preview-wrap {
    margin: 0 1.5rem 1.5rem;
    position: relative;
    background: #12141c;
    border-radius: 8px;
    overflow: hidden;
    display: none;
  }
  .preview-wrap img {
    width: 100%;
    display: block;
    border-radius: 8px;
  }

  .analyze-btn {
    display: block;
    margin: 0 1.5rem 1.5rem;
    width: calc(100% - 3rem);
    padding: 12px;
    background: #dc2626;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    display: none;
  }
  .analyze-btn:hover { background: #b91c1c; }
  .analyze-btn:disabled { background: #4a1414; color: #888; cursor: not-allowed; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results panel */
  .results-empty {
    padding: 3rem 1.5rem;
    text-align: center;
    color: #444;
  }
  .results-empty svg { margin-bottom: 12px; opacity: 0.3; }
  .results-empty p { font-size: 13px; }

  .detection-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 1.25rem;
    border-bottom: 1px solid #1e2130;
  }
  .detection-item:last-child { border-bottom: none; }

  .det-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .det-label { font-size: 14px; font-weight: 500; flex: 1; }
  .det-conf  { font-size: 13px; color: #888; }

  .conf-bar-wrap {
    height: 4px;
    background: #2a2d3a;
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .conf-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  .alert-banner {
    margin: 0 1.25rem 1.25rem;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    display: none;
  }
  .alert-danger  { background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.3); color: #f87171; }
  .alert-warning { background: rgba(234,179,8,0.12); border: 1px solid rgba(234,179,8,0.3);  color: #fbbf24; }
  .alert-safe    { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.25); color: #4ade80; }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 1rem 1.25rem;
    border-top: 1px solid #2a2d3a;
  }
  .stat { background: #12141c; border-radius: 8px; padding: 10px 12px; }
  .stat-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-size: 20px; font-weight: 600; margin-top: 2px; }

  @media (max-width: 768px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🚗</div>
  <div>
    <h1>Driver Behaviour Detection</h1>
    <p>YOLO26n · 4 classes · mAP50 90.7%</p>
  </div>
  <span class="badge">● Model Ready</span>
</header>

<main>
  <!-- Left: upload + image -->
  <div>
    <div class="card">
      <div class="card-header">Upload Image</div>

      <div class="upload-area" id="uploadArea">
        <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
        </svg>
        <p>Drag & drop or <span>browse files</span></p>
        <p style="margin-top:6px;font-size:12px;">JPG, PNG, WEBP supported</p>
        <input type="file" id="fileInput" accept="image/*">
      </div>

      <div class="preview-wrap" id="previewWrap">
        <img id="previewImg" src="" alt="Preview">
      </div>

      <button class="analyze-btn" id="analyzeBtn">Analyse Image</button>
    </div>
  </div>

  <!-- Right: results -->
  <div>
    <div class="card" id="resultsCard">
      <div class="card-header">Detections</div>

      <div id="alertBanner" class="alert-banner"></div>

      <div class="results-empty" id="emptyState">
        <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
          <path stroke-linecap="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75"/>
        </svg>
        <p>Upload an image to see detections</p>
      </div>

      <div id="detectionsList" style="display:none;"></div>

      <div class="summary-grid" id="summaryGrid" style="display:none;">
        <div class="stat">
          <div class="stat-label">Detections</div>
          <div class="stat-value" id="statCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Top class</div>
          <div class="stat-value" id="statTop" style="font-size:14px;margin-top:6px;">—</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const CLASS_COLORS = {
  Awake:    '#50c850',
  Phone:    '#ff8c00',
  Seatbelt: '#00c8dc',
  drowsy:   '#dc2626',
};

const uploadArea  = document.getElementById('uploadArea');
const fileInput   = document.getElementById('fileInput');
const previewWrap = document.getElementById('previewWrap');
const previewImg  = document.getElementById('previewImg');
const analyzeBtn  = document.getElementById('analyzeBtn');
const emptyState  = document.getElementById('emptyState');
const detList     = document.getElementById('detectionsList');
const summaryGrid = document.getElementById('summaryGrid');
const alertBanner = document.getElementById('alertBanner');

let selectedFile = null;

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadFile(f);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(file) {
  selectedFile = file;
  const url = URL.createObjectURL(file);
  previewImg.src = url;
  previewWrap.style.display = 'block';
  analyzeBtn.style.display = 'block';
  analyzeBtn.textContent = 'Analyse Image';
  analyzeBtn.disabled = false;
  resetResults();
}

function resetResults() {
  emptyState.style.display = 'block';
  detList.style.display = 'none';
  summaryGrid.style.display = 'none';
  alertBanner.style.display = 'none';
  detList.innerHTML = '';
}

analyzeBtn.addEventListener('click', async () => {
  if (!selectedFile) return;

  analyzeBtn.disabled = true;
  analyzeBtn.innerHTML = '<span class="spinner"></span>Analysing...';
  resetResults();

  const form = new FormData();
  form.append('image', selectedFile);

  try {
    const res  = await fetch('/predict', { method: 'POST', body: form });
    const data = await res.json();

    if (data.error) {
      alert('Error: ' + data.error);
      return;
    }

    // Replace preview with annotated image
    previewImg.src = data.image;

    // Show detections
    emptyState.style.display = 'none';
    detList.style.display = 'block';
    summaryGrid.style.display = 'grid';

    if (data.detections.length === 0) {
      detList.innerHTML = '<div style="padding:1.5rem;text-align:center;color:#555;font-size:13px;">No detections found — try a lower confidence threshold</div>';
    } else {
      data.detections.forEach(d => {
        const color = CLASS_COLORS[d.label] || '#888';
        detList.innerHTML += `
          <div class="detection-item">
            <div class="det-dot" style="background:${color}"></div>
            <div style="flex:1">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span class="det-label">${d.label}</span>
                <span class="det-conf">${d.confidence}%</span>
              </div>
              <div class="conf-bar-wrap">
                <div class="conf-bar" style="width:${d.confidence}%;background:${color}"></div>
              </div>
            </div>
          </div>`;
      });
    }

    // Summary
    document.getElementById('statCount').textContent = data.count;
    const top = data.detections.sort((a,b) => b.confidence - a.confidence)[0];
    document.getElementById('statTop').textContent = top ? top.label : '—';

    // Alert banner
    const labels = data.detections.map(d => d.label);
    alertBanner.style.display = 'block';
    if (labels.includes('drowsy')) {
      alertBanner.className = 'alert-banner alert-danger';
      alertBanner.textContent = '⚠ Drowsiness detected — driver may be impaired';
    } else if (labels.includes('Phone') || labels.includes('Seatbelt')) {
      alertBanner.className = 'alert-banner alert-warning';
      alertBanner.textContent = labels.includes('Phone')
        ? '⚠ Phone use detected while driving'
        : '⚠ Seatbelt not detected';
    } else if (labels.includes('Awake')) {
      alertBanner.className = 'alert-banner alert-safe';
      alertBanner.textContent = '✓ Driver appears alert and attentive';
    }

  } catch (err) {
    alert('Failed to connect to server. Make sure app.py is running.');
  } finally {
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = 'Analyse Again';
  }
});
</script>
</body>
</html>
